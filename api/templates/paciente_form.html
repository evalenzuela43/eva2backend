<!-- paciente_form.html -->
{% extends 'base.html' %}

{% block content %}
  <h2>{% if object %}Editar{% else %}Crear{% endif %} Paciente</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if object %}Actualizar{% else %}Crear{% endif %}</button>
  </form>
  <a href="{% url 'paciente-list' %}">Volver a la lista</a>
{% endblock %}
